name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Etapa 1 (sección 21 del prompt): install, lint, typecheck, test, build en cada
# push/PR. Sin CD a producción todavía -- no hay ningún job de deploy acá.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemagrido_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Misma base de test que usan localmente los devs (ver apps/api/vitest.config.ts
      # y docs/ETAPA-1-BASE-CORE.md, sección "Tests") -- nunca la base de desarrollo/producción.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemagrido_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sistemagrido_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (informativa, no bloquea la CI)
        run: npm audit --audit-level=high || true

      - name: Compilar packages/shared-types (lo consumen el resto de los paquetes)
        run: npm run build --workspace packages/shared-types

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Aplicar migraciones contra la base de test
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
