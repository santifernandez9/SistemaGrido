services:
  - type: web
    name: sistema-grido-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # Compila packages/shared-types y genera el cliente de Prisma. Normalmente
    # NO corre migraciones acá a propósito (docs/ETAPA-2-CATALOGO-MAESTROS.md,
    # sección "Migraciones en staging"): aplicarlas es un paso manual y
    # controlado, no automático en cada deploy.
    #
    # EXCEPCIÓN TEMPORAL (setup inicial del primer entorno, a pedido del
    # usuario para evitar instalar Node localmente): este build también
    # corre `migrate:deploy` + `seed` UNA VEZ para levantar el esquema y los
    # datos base contra un Supabase recién creado. Sacar estas dos líneas del
    # buildCommand apenas el primer deploy termine bien -- dejarlas
    # permanentemente reseedearía (sin destruir datos, el seed es idempotente
    # por upsert, pero igual es innecesario) en cada deploy futuro.
    buildCommand: npm ci && npm run build --workspace packages/shared-types && npm run generate --workspace packages/db && npm run migrate:deploy --workspace packages/db && npm run seed --workspace packages/db
    # Prisma 6 con el generador `prisma-client` emite el cliente como fuente TS
    # (no JS precompilado) -- el backend corre con tsx en desarrollo Y en
    # producción, ver docs/ETAPA-1-BASE-CORE.md, sección "Decisiones técnicas".
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Todas las siguientes son secretas o dependen del entorno real -- se cargan
      # a mano en el dashboard de Render, nunca se versionan acá (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
