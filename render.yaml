services:
  - type: web
    name: sistema-grido-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    # Compila packages/shared-types y genera el cliente de Prisma. NO corre
    # migraciones acá a propósito (docs/ETAPA-2-CATALOGO-MAESTROS.md, sección
    # "Migraciones en staging" -- ampliado en docs/ETAPA-6.2-CIERRE-INTEGRAL.md,
    # sección "Staging/Pilot readiness"): aplicarlas es un paso MANUAL y
    # controlado, nunca automático en cada deploy.
    #
    # Etapa 6.2, sección 22 del prompt: la excepción temporal que agregaba
    # `migrate:deploy` + `seed` acá (bootstrap del primer Supabase recién
    # creado, sin Node local) ya cumplió su propósito -- el primer deploy
    # funcionó y el usuario confirmó login exitoso. Se revierte para volver
    # al flujo manual documentado: cada migración nueva (incluidas las de
    # Etapa 6.2 y 6.2.1) se aplica a mano con `npx prisma migrate deploy`
    # apuntando a `DATABASE_URL`/`DIRECT_URL` de Supabase, ANTES de este
    # deploy, nunca de forma automática. Dejarlo automático reseedearía (sin
    # destruir datos, el seed es idempotente por upsert, pero igual es
    # innecesario e imprevisible) en cada deploy futuro.
    #
    # Etapa 6.2.1 agregó UNA migración nueva, puramente aditiva:
    # `20260912090000_deposito_closed_units_etapa6_2_1` -- debe aplicarse a
    # mano en staging/producción ANTES de este deploy, igual que la de
    # Etapa 6.2, ver docs/ETAPA-6.2.1-CORRECCIONES-HITO1.md, sección "Staging".
    buildCommand: npm ci && npm run build --workspace packages/shared-types && npm run generate --workspace packages/db
    # Prisma 6 con el generador `prisma-client` emite el cliente como fuente TS
    # (no JS precompilado) -- el backend corre con tsx en desarrollo Y en
    # producción, ver docs/ETAPA-1-BASE-CORE.md, sección "Decisiones técnicas".
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Todas las siguientes son secretas o dependen del entorno real -- se cargan
      # a mano en el dashboard de Render, nunca se versionan acá (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
